name: Release

on:
  push:
    branches: [master]

# Read-only default: nothing here writes with GITHUB_TOKEN except the GitHub Packages
# publish, which widens it for itself. release-please authenticates with the
# it4c-release-bot app token, and npm authenticates over OIDC.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # No `permissions:` block needed: create-github-app-token authenticates with the app
      # id and private key, and release-please-action takes its credentials solely from its
      # `token` input.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token to what release-please does. Without these it inherits
          # every permission the app is installed with; the workflow-level block above
          # governs GITHUB_TOKEN only and does not constrain this one.
          #   contents      — commits, branches, tags, the GitHub release
          #   pull-requests — the release pull request
          #   issues        — its `autorelease: pending`/`tagged` labels, which go through
          #                   the issues API and are therefore a separate scope
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          token: ${{ steps.app-token.outputs.token }}

  # Everything that runs third-party code lives HERE, in a job that can mint neither an
  # OIDC token nor a packages-scoped GITHUB_TOKEN. `ACTIONS_ID_TOKEN_REQUEST_URL`/`_TOKEN`
  # are job-wide environment variables readable by every step, including any `postinstall`
  # in the tree `npm ci` unpacks. Granting `id-token: write` to the job that installs
  # typescript-eslint, vite and the plugin set would let any of them exchange a token for
  # publish rights on eslint-config-it4c.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      # The exact bytes that get published. Packing here rather than in the publish jobs is
      # what makes the split work: those then need neither the sources nor an install.
      # `--pack-destination` does not create the directory, it fails with ENOENT.
      - name: Pack tarball for npmjs
        run: |
          mkdir -p "${RUNNER_TEMP}/pkg-npm"
          npm pack --pack-destination "${RUNNER_TEMP}/pkg-npm"

      # GitHub Packages only accepts names scoped to the owner, so the same build is packed
      # a second time under the scoped name. Order matters — the unscoped tarball above is
      # taken before package.json is rewritten.
      - name: Pack tarball for GitHub Packages
        run: |
          mkdir -p "${RUNNER_TEMP}/pkg-gpr"
          npm pkg set name='@it4change/eslint-config-it4c'
          npm pack --pack-destination "${RUNNER_TEMP}/pkg-gpr"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg-npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: gpr-package
          path: ${{ runner.temp }}/pkg-gpr/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Job-level blocks REPLACE the workflow-level one rather than adding to it.
    #   id-token: write — mints the OIDC token npm trusted publishing authenticates with.
    #                     No NPM_TOKEN: the registry verifies the OIDC claims (repository,
    #                     workflow filename, ref) against the trusted publisher configured
    #                     on the package, so there is no long-lived credential to rotate.
    #                     It also makes npm attach a provenance attestation automatically —
    #                     `id-token` is what signs it, so `--provenance` is not passed.
    #                     The attested subject is computed from the tarball's bytes, so
    #                     provenance survives packing in a different job.
    permissions:
      id-token: write
    steps:
      # No checkout at all: the Node version is literal below and the tarball arrives as an
      # artifact, so nothing from the repository is needed — and nothing here can execute.
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, whose own floor is Node >= 22.14.0. npm
          # comes from Node's bundle, and that is the tighter constraint: the first Node
          # bundling >= 11.5.1 is 24.5.0. Below that, OIDC drops out silently.
          node-version: 24
          # Still required without a token: it writes the .npmrc pointing npm at the public
          # registry, which is where the OIDC exchange happens.
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg
      # Authenticated by the OIDC token, not by a secret. The trusted publisher on npm pins
      # the workflow FILENAME (`release.yml`), so moving or renaming this file breaks
      # publishing with a 404 until the configuration on npmjs.com is updated to match.
      #
      # Publishing a tarball rather than a directory runs no lifecycle scripts at all — npm
      # gates those on `spec.type === 'directory'`. `--ignore-scripts` is redundant
      # belt-and-braces, and the run happens outside any package directory so npm cannot
      # pick up a local package.json.
      - run: npm publish "${RUNNER_TEMP}"/pkg/*.tgz --access public --ignore-scripts

  # GitHub Packages has no OIDC trusted publishing for npm, so this one keeps GITHUB_TOKEN.
  # It is a separate job purely so that `packages: write` never coexists with `npm ci`.
  publish-gpr:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@it4change'
      - uses: actions/download-artifact@v8
        with:
          name: gpr-package
          path: ${{ runner.temp }}/pkg
      - run: npm publish "${RUNNER_TEMP}"/pkg/*.tgz --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
